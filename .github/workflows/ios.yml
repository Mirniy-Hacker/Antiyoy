name: Build iOS IPA

# Запускается только вручную. Раннеры macOS бесплатны без лимита минут
# на публичных репозиториях — репозиторий должен быть публичным.
on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Только диагностика: вывести список задач и версии, не собирать'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Версия Xcode фиксируется явно: образ macos-latest меняется без
      # предупреждения, а MobiVM чувствителен к версии iOS SDK.
      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: gradle/actions/setup-gradle@v4

      - name: Environment
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version

      - run: chmod +x ./gradlew

      # Первый прогон: убедиться в точном имени задачи и что модуль ios есть.
      - name: List iOS tasks
        run: ./gradlew :ios:tasks --all

      - name: Build unsigned IPA
        if: ${{ !inputs.diagnose }}
        run: ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true --stacktrace

      # IPA отдаётся неподписанной: AltStore подписывает её сам сертификатом
      # бесплатного Apple ID при установке.
      - name: Locate artifact
        if: ${{ !inputs.diagnose }}
        run: find ios/build -name "*.ipa" -o -name "*.app" | head -50

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.diagnose }}
        with:
          name: antiyoy-mod-ipa
          path: |
            ios/build/robovm/*.ipa
            ios/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
