plugins {
  id 'application'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

// Ассеты лежат в корне репозитория, как в оригинале.
sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

application.mainClass = 'yio.tro.antiyoy.lwjgl3.Lwjgl3Launcher'
application.applicationName = appName

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(8)
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

  // LWJGL ниже 3.4.3 шумит предупреждениями на свежих JDK.
  constraints {
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)

run {
  // Оригинал ищет ассеты относительно рабочего каталога.
  workingDir = rootProject.file('assets').path
  jvmArgs += '--enable-native-access=ALL-UNNAMED'
  // Иначе вывод в консоль Windows идёт в кодировке страницы и кириллица бьётся.
  jvmArgs += '-Dfile.encoding=UTF-8'
  jvmArgs += '-Dsun.stdout.encoding=UTF-8'
  jvmArgs += '-Dsun.stderr.encoding=UTF-8'
  if (os.contains('mac')) jvmArgs += '-XstartOnFirstThread'
  // Аргументы командной строки пробрасываются в игру: нужно для --sim.
  if (project.hasProperty('args')) {
    args = project.property('args').split('\s+').toList()
  }
}

jar {
  archiveFileName.set("${appName}-${projectVersion}.jar")
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  manifest {
    attributes 'Main-Class': application.mainClass,
               'Enable-Native-Access': 'ALL-UNNAMED',
               'Multi-Release': 'true'
  }
}

eclipse.project.name = appName + '-lwjgl3'
